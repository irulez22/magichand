<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0714">
  <meta name="description" content="A calm, glowing touchscreen playroom for a young child with limited arm movement.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Magic Hand Play</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <canvas id="scene" aria-label="Play area. Games respond to any touch."></canvas>
  </div>
  <div id="boot-error" hidden></div>

  <script>
    window.addEventListener('error', function (e) {
      var el = document.getElementById('boot-error');
      if (!el) return;
      el.hidden = false;
      el.textContent = 'Something went wrong: ' + (e.message || e.type) +
        '. Reload the page (F5). If it keeps happening, see README.md.';
    });
  </script>

  <script src="js/util.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/zones.js"></script>
  <script src="js/input.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/pictures.js"></script>
  <script src="js/games/base.js"></script>
  <script src="js/games/balloons.js"></script>
  <script src="js/games/garden.js"></script>
  <script src="js/games/stars.js"></script>
  <script src="js/games/painting.js"></script>
  <script src="js/games/photos.js"></script>
  <script src="js/games/goats.js"></script>
  <script src="js/games/registry.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calibration.js"></script>
  <script src="js/parentgate.js"></script>
  <script src="js/tray.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
